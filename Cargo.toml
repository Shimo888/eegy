[package]
name = "eegy"
version = "0.1.0"
edition = "2024"
description = "An easy EEG signal processing library in Rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
smallvec = "1.16.3"
serde = { version = "1.0.229", features = ["derive"] }
erased-serde = "0.4.10"

[build-dependencies]
csbindgen = "1.9.8"
